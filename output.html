<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VerseCast Projector</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at top, #1f6ff0, #0b2f7a 70%); color: #fff; font-family: Georgia, "Times New Roman", serif; overflow: hidden; cursor: none; }
  #box { position: absolute; inset: 6vh 6vw 16vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #text { text-align: center; line-height: 1.3; text-shadow: 0 2px 8px #000; }
  #text sup { font-size: 0.5em; opacity: 0.7; margin-right: 0.2em; }
  #ref { position: absolute; left: 0; right: 0; bottom: 5vh; text-align: center; font: 600 5vh system-ui, sans-serif; letter-spacing: 0.05em; color: #fff; opacity: 0.85; }
  #hint { position: absolute; top: 1em; left: 1em; font: 14px system-ui, sans-serif; color: #fff; opacity: 0.6; }

  #ref .kjv { font-weight: 400; font-size: 0.8em; }

  /* ?overlay — transparent lower third for OBS / NDI: bold reference above the verse, white text with a shadow, no box */
  .overlay, .overlay body { background: transparent; }
  .overlay #box { inset: auto 6vw 20vh; height: 28vh; flex-direction: column; justify-content: flex-end; gap: 1.2vh; }
  .overlay #ref { position: static; font: 700 4.6vh Georgia, "Times New Roman", serif; letter-spacing: 0; opacity: 1; }
  .overlay #ref, .overlay #text { text-shadow: 0 0 3px #000, 0 2px 8px #000; }
  .overlay.empty #box { display: none; }

  /* "Full screen" layout in OBS: big centred text over a dimmed picture */
  .overlay.big:not(.empty) body { background: rgba(0, 0, 0, 0.55); }
  .overlay.big #box { inset: 8vh 8vw; height: auto; justify-content: center; gap: 3vh; }
  .overlay.big #ref { font-size: 5.5vh; }

  /* song lyrics keep their line breaks */
  .song #text { white-space: pre-line; }
</style>
</head>
<body>
<div id="hint" hidden>Drag this window to the projector screen, then double-click for full screen.</div>
<div id="box"><div id="text"></div></div>
<div id="ref"></div>
<script>
  const box = document.getElementById("box"), text = document.getElementById("text"), ref = document.getElementById("ref");
  const root = document.documentElement;
  const OVERLAY = new URLSearchParams(location.search).has("overlay");
  root.classList.toggle("overlay", OVERLAY);
  if (OVERLAY) box.prepend(ref); // reference sits right above the verse
  document.getElementById("hint").hidden = !window.opener;

  function fit() {
    let size = !OVERLAY ? 9 : root.classList.contains("big") ? 8 : 4.6;
    text.style.fontSize = size + "vh";
    while (size > 1.5 && (box.scrollHeight > box.clientHeight || text.scrollWidth > box.clientWidth)) {
      size -= 0.25;
      text.style.fontSize = size + "vh";
    }
  }

  function render(msg) {
    text.replaceChildren();
    const songSlide = msg && msg.song && msg.song.slides[msg.song.index];
    root.classList.toggle("empty", !(msg && (msg.lines || songSlide)));
    root.classList.toggle("big", !!(msg && msg.layout === "full"));
    root.classList.toggle("song", !!songSlide);
    if (songSlide) {
      ref.replaceChildren(msg.song.name);
      text.textContent = songSlide.text;
      return fit();
    }
    ref.replaceChildren(...(msg && msg.label ? [msg.label + " ", Object.assign(document.createElement("span"), { className: "kjv", textContent: "(KJV)" })] : []));
    if (!msg || !msg.lines) return;
    for (const l of msg.lines) {
      if (msg.lines.length > 1) text.append(Object.assign(document.createElement("sup"), { textContent: l.v }));
      text.append(l.text + " ");
    }
    fit();
  }

  // EventSource reconnects by itself if the server restarts
  new EventSource("/events" + location.search).onmessage = e => render(JSON.parse(e.data));
  window.addEventListener("resize", fit);
  document.addEventListener("dblclick", () => {
    document.getElementById("hint").hidden = true;
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  });
</script>
</body>
</html>
