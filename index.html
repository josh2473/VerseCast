<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VerseCast</title>
<style>
  :root { --blue: #1557d6; --blue-dark: #0b3a94; --blue-soft: #e8f0ff; --line: #d5e1f7; --ink: #10213f; --muted: #5b6b87; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #fff; color: var(--ink); font: 15px system-ui, sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: var(--blue); color: #fff; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  button { background: #fff; color: var(--blue); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  button:hover { background: var(--blue-soft); }
  button.on { background: #d62839; color: #fff; border-color: #d62839; }
  label { display: flex; gap: 6px; align-items: center; }
  select { background: #fff; color: var(--blue-dark); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font: 14px system-ui, sans-serif; max-width: 260px; }
  #status { margin-left: auto; font-size: 13px; opacity: 0.9; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 0; }
  section { background: #fff; padding: 14px; display: flex; flex-direction: column; min-height: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--blue); margin: 0 0 8px; }
  #transcript { flex: 1; overflow-y: auto; line-height: 1.5; }
  #transcript p { margin: 0 0 6px; }
  #transcript mark { background: var(--blue-soft); color: var(--blue-dark); font-weight: 600; border-radius: 3px; padding: 0 3px; }
  #interim { color: var(--muted); }
  #search { width: 100%; padding: 9px 11px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: inherit; font: inherit; margin-bottom: 12px; }
  #search:focus { outline: 2px solid var(--blue); }
  #preview { background: linear-gradient(160deg, var(--blue-dark), var(--blue)); color: #fff; border-radius: 8px; padding: 14px; min-height: 120px; max-height: 35vh; overflow-y: auto; margin-bottom: 8px; font-family: Georgia, serif; font-size: 17px; line-height: 1.4; }
  #preview b { display: block; font-family: system-ui, sans-serif; margin-top: 8px; opacity: 0.85; }
  .empty { opacity: 0.6; }
  .row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .row button, .mini button { background: var(--blue); color: #fff; border-color: var(--blue); }
  .row button:hover, .mini button:hover { background: var(--blue-dark); }
  [hidden] { display: none !important; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; align-items: center; }
  .tabs .tab.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .tabs select { margin-left: auto; }
  .pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .songbar { display: flex; gap: 6px; margin-bottom: 8px; }
  .songbar input, dialog input, dialog textarea { flex: 1; width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); font: inherit; color: inherit; background: #fff; }
  .list { flex: 1; overflow-y: auto; list-style: none; margin: 0 0 8px; padding: 0; }
  #songList { flex: 0 1 auto; max-height: 28vh; }
  .list li { padding: 8px 10px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
  .list li:hover { background: var(--blue-soft); }
  .list li.live { background: var(--blue); color: #fff; }
  .list small { opacity: 0.6; white-space: nowrap; }
  .list li.guess:not(.live) { color: var(--muted); font-style: italic; }
  #slideList li { display: block; white-space: pre-line; line-height: 1.35; }
  #songTitle { display: flex; gap: 8px; align-items: center; }
  #songTitle button { padding: 2px 8px; font-size: 11px; }
  dialog { border: 1px solid var(--line); border-radius: 10px; width: min(560px, 92vw); }
  dialog form { display: flex; flex-direction: column; gap: 10px; }
  #transcript mark.guess { background: #fff; border: 1px dashed var(--blue); }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; } }

  /* ?dock — OBS custom browser dock. OBS's browser can't do speech recognition, so listening stays in Chrome. */
  .dock body { font-size: 13px; }
  .dock header { padding: 6px 8px; gap: 6px; }
  .dock header h1 { font-size: 14px; }
  .dock #openMini, .dock #mic, .dock #lang, .dock header label:not(#screen2Label) { display: none; }
  .dock #listen.on { background: #d62839; border-color: #d62839; }
  .dock #status { font-size: 11px; }
  .dock main { grid-template-columns: 1fr; }
  .dock main > section:first-child { display: none; }
  .dock section { padding: 8px; }
  .dock #preview { font-size: 14px; min-height: 70px; max-height: 30vh; }
  .dock .row { margin-bottom: 8px; }
  /* OBS's default dark (Yami) theme colours, so it sits in with the other docks (OBS shows a "transparent" dock as white) */
  .dock, .dock body { background: #1d1f26; }
  .dock header, .dock main, .dock section { background: transparent; }
  .dock body { color: #e6e6e6; }
  .dock h2, .dock #status, .dock .list li.guess:not(.live) { color: #9aa3b5; }
  .dock #search, .dock .songbar input, .dock select, .dock dialog, .dock dialog input, .dock dialog textarea { background: #1d1f26; border-color: #3c404b; color: #e6e6e6; }
  .dock #preview { background: #2b2e38; }
  .dock button, .dock .row button { background: #3c404b; border-color: #3c404b; color: #fff; }
  .dock button:hover, .dock .row button:hover, .dock .list li:hover { background: #4a4f5c; }
  .dock .list li.live, .dock .tabs .tab.on { background: #284cb8; border-color: #284cb8; }

  /* always-on-top mini window */
  .mini { margin: 0; padding: 10px; height: 100vh; display: flex; flex-direction: column; gap: 8px; }
  .mini .now { background: linear-gradient(160deg, var(--blue-dark), var(--blue)); color: #fff; border-radius: 8px; padding: 10px; flex: 1; overflow: hidden; font: 14px/1.35 Georgia, serif; }
  .mini .now b { display: block; font: 700 16px system-ui, sans-serif; margin-bottom: 4px; }
  .mini .btns { display: flex; gap: 6px; }
  .mini .btns button { flex: 1; padding: 6px 4px; }
  .mini .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini .chips button { background: var(--blue-soft); color: var(--blue-dark); border-color: var(--line); padding: 4px 8px; font-size: 12px; }
  .mini .chips button.live { background: var(--blue); color: #fff; }
  .mini .listen.on { background: #d62839; border-color: #d62839; }
</style>
</head>
<body>
<header>
  <h1>VerseCast</h1>
  <label id="screen2Label" title="Full-screen projector on the second screen"><input type="checkbox" id="screen2"> 2nd screen</label>
  <button id="openMini">Mini window (always on top)</button>
  <select id="mic" title="Input source"><option value="">Default microphone</option></select>
  <select id="lang" title="Speech language / accent">
    <option value="en-GH">English (Ghana)</option>
    <option value="en-NG">English (Nigeria)</option>
    <option value="en-GB">English (UK)</option>
    <option value="en-US">English (US)</option>
  </select>
  <button id="listen">Start listening</button>
  <button id="clear">Clear screen</button>
  <label><input type="checkbox" id="auto" checked> Auto-show detected verses</label>
  <span id="status">Not listening</span>
</header>
<main>
  <section>
    <h2>Live transcript</h2>
    <div id="transcript"><span id="interim"></span></div>
  </section>
  <section>
    <div class="tabs">
      <button id="tabBible" class="tab on">Bible</button>
      <button id="tabSongs" class="tab">Songs</button>
      <select id="layout" title="How verses and songs look in OBS">
        <option value="lower">Lower third</option>
        <option value="full">Full screen</option>
      </select>
    </div>
    <h2>On screen</h2>
    <div id="preview"><span class="empty">Nothing showing</span></div>
    <div class="row">
      <button id="prev" title="Left arrow">◀ Prev</button>
      <button id="next" title="Right arrow">Next ▶</button>
    </div>
    <div id="biblePane" class="pane">
      <input id="search" placeholder="Type a reference or words from a verse, e.g. John 3:16 or all is vanity" autocomplete="off">
      <h2>Detected references</h2>
      <ul id="detected" class="list"></ul>
    </div>
    <div id="songsPane" class="pane" hidden>
      <div class="songbar">
        <input id="songSearch" placeholder="Search songs by title or number" autocomplete="off">
        <button id="newSong">+ New</button>
      </div>
      <ul id="songList" class="list"></ul>
      <h2 id="songTitle"></h2>
      <ul id="slideList" class="list"></ul>
    </div>
  </section>
</main>
<dialog id="songDialog">
  <form method="dialog">
    <h2>New song</h2>
    <input id="newTitle" placeholder="Title" required maxlength="200">
    <textarea id="newLyrics" rows="14" placeholder="Paste the lyrics. Leave a blank line between slides." required></textarea>
    <div class="row">
      <button value="save">Save</button>
      <button value="cancel" formnovalidate>Cancel</button>
    </div>
  </form>
</dialog>
<script src="kjv.js"></script>
<script src="parse.js"></script>
<script src="predict.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const INDEX = Predict.buildIndex(KJV);
  const DOCK = new URLSearchParams(location.search).has("dock"); // compact layout for an OBS custom browser dock
  document.documentElement.classList.toggle("dock", DOCK);
  let out = null, mini = null, current = null, lastFinal = "";
  let detected = []; // [{ref, predicted, time}], newest first
  // on screen is either the verse `current` or slide `slide` of `liveSong`; `song` is the one open in the Songs tab
  let song = null, liveSong = null, slide = null;
  let edgeListening = false; // dock only: whether the main (Chrome) window last said it's listening
  const me = Math.random().toString(36).slice(2);

  // ---- projector ----
  // the server relays this to every projector page (popup, OBS Browser Sources) and to the other control pages (OBS dock)
  function send() {
    const msg = { from: me, layout: $("layout").value, ref: current, recent: detected.slice(0, 20), listening: DOCK ? edgeListening : listening };
    if (current) Object.assign(msg, { label: Parse.label(current), lines: Parse.lookup(KJV, current) });
    else if (slide !== null) msg.song = { ...liveSong, index: slide };
    fetch("/state", { method: "POST", body: JSON.stringify(msg) })
      .catch(() => { $("status").textContent = "VerseCast server isn't running — start it with Start VerseCast.bat"; });
  }
  // follow changes made from another control page, e.g. the OBS dock
  const events = new EventSource(DOCK ? "/events" : "/events?operator");
  // the dock can't hear (OBS's browser has no speech recognition), so it asks this page to start/stop listening
  events.addEventListener("command", e => {
    const { cmd } = JSON.parse(e.data);
    if (cmd === "listen" && !listening && SR) setListening(true);
    if (cmd === "stop" && listening) setListening(false);
    if (cmd === "close") { if (listening) setListening(false); window.close(); } // OBS closed
  });
  events.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg && DOCK) showListening(edgeListening = !!msg.listening);
    if (!msg || msg.from === me) return;
    current = msg.ref || null;
    detected = msg.recent || [];
    $("layout").value = msg.layout || "lower";
    liveSong = msg.song || liveSong;
    slide = msg.song ? msg.song.index : null;
    if (msg.song && !song) openSong(msg.song); // follow along in the Songs tab
    renderDetected();
    refresh(false);
  };
  $("layout").onchange = () => send();
  // 2nd screen on: full screen there when there is one, otherwise a window you can drag. Off: closes it and stays off.
  fetch("/settings").then(r => r.json()).then(s => { $("screen2").checked = s.projector; }).catch(() => {});
  $("screen2").onchange = async e => {
    if (!e.target.checked) return fetch("/projector/off", { method: "POST" }).catch(() => {});
    const r = await fetch("/projector", { method: "POST" }).catch(() => null);
    if (r && r.ok) return;
    out = window.open("output.html", "versecast-output", "popup,width=1280,height=720");
    if (!out) alert("Your browser blocked the projector window. Allow pop-ups for this page and try again.");
  };

  function verseText(lines) {
    return lines.map(l => (lines.length > 1 ? l.v + " " : "") + l.text).join(" ");
  }

  // what's on screen as [title, text], or null
  function onScreen() {
    if (current) return [Parse.label(current), verseText(Parse.lookup(KJV, current))];
    if (slide !== null) return [liveSong.name, liveSong.slides[slide].text];
    return null;
  }

  function refresh(broadcast = true) {
    const now = onScreen(), label = current && Parse.label(current);
    if (now) $("preview").replaceChildren(now[1], Object.assign(document.createElement("b"), { textContent: now[0] }));
    else $("preview").innerHTML = '<span class="empty">Nothing showing</span>';
    $("preview").style.whiteSpace = slide !== null ? "pre-line" : "";
    for (const li of $("detected").children) li.classList.toggle("live", li.dataset.label === label);
    const live = slide !== null && song && liveSong && song.id === liveSong.id ? slide : -1;
    [...$("slideList").children].forEach((li, i) => li.classList.toggle("live", i === live));
    renderMini();
    if (broadcast) send();
  }

  function show(ref) {
    if (!Parse.lookup(KJV, ref)) return false;
    current = ref, slide = null;
    refresh();
    return true;
  }
  function showSlide(i) {
    if (!liveSong || !liveSong.slides[i]) return;
    current = null, slide = i;
    refresh();
  }
  function clearScreen() { current = null, slide = null; refresh(); }
  // tapping the verse or slide that's already showing hides it
  const toggle = ref => current && Parse.label(current) === Parse.label(ref) ? clearScreen() : show(ref);
  function toggleSlide(i) {
    if (slide === i && liveSong && liveSong.id === song.id) return clearScreen();
    liveSong = song;
    showSlide(i);
  }
  $("clear").onclick = clearScreen;

  function step(dir) {
    if (slide !== null) return showSlide(slide + dir);
    if (!current) return;
    const ch = KJV[current.book][current.chapter];
    const v = dir > 0 ? current.verseEnd + 1 : current.verse - 1;
    if (ch[v]) show({ ...current, verse: v, verseEnd: v });
  }
  $("prev").onclick = () => step(-1);
  $("next").onclick = () => step(1);
  function onKey(e) {
    if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || $("songDialog").open) return;
    if (e.key === "ArrowRight") step(1);
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "Escape") clearScreen();
  }
  document.addEventListener("keydown", onKey);

  // ---- detected list ----
  // predicted = guessed from quoted words, so it's listed but never auto-shown
  function addDetected(ref, predicted = false) {
    const label = Parse.label(ref);
    if (!Parse.lookup(KJV, ref)) return;
    if (predicted && detected.slice(0, 5).some(d => Parse.label(d.ref) === label)) return;
    if (!detected[0] || Parse.label(detected[0].ref) !== label) {
      detected.unshift({ ref, predicted, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) });
      renderDetected();
    }
    if ($("auto").checked && !predicted) show(ref); else refresh();
  }

  function renderDetected() {
    $("detected").replaceChildren(...detected.map(({ ref, predicted, time }) => {
      const li = document.createElement("li");
      li.dataset.label = Parse.label(ref);
      li.classList.toggle("guess", predicted);
      li.append(Parse.label(ref), Object.assign(document.createElement("small"), { textContent: (predicted ? "quoted? · " : "") + time }));
      li.title = Parse.lookup(KJV, ref).map(l => l.text).join(" ");
      li.onclick = () => toggle(ref);
      return li;
    }));
  }

  $("search").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const [ref] = Parse.findRefs(e.target.value);
    const guesses = ref ? [] : Predict.predict(INDEX, e.target.value);
    if (ref && Parse.lookup(KJV, ref)) { addDetected(ref); show(ref); e.target.value = ""; }
    else if (guesses.length) { guesses.slice().reverse().forEach(g => addDetected(g.ref, true)); show(guesses[0].ref); e.target.value = ""; }
    else e.target.style.borderColor = "#d62839", setTimeout(() => e.target.style.borderColor = "", 800);
  });

  // ---- songs: FreeShow library + songs pasted into VerseCast ----
  let allSongs = [];
  function setTab(tab) {
    $("biblePane").hidden = tab !== "bible";
    $("songsPane").hidden = tab !== "songs";
    $("tabBible").classList.toggle("on", tab === "bible");
    $("tabSongs").classList.toggle("on", tab === "songs");
    if (tab === "songs" && !allSongs.length) loadSongs();
  }
  $("tabBible").onclick = () => setTab("bible");
  $("tabSongs").onclick = () => setTab("songs");

  async function loadSongs() {
    allSongs = await fetch("/songs").then(r => r.json()).catch(() => []);
    renderSongList();
  }

  function renderSongList() {
    const q = $("songSearch").value.trim().toLowerCase();
    const hits = allSongs.filter(s => !q || s.name.toLowerCase().includes(q) || s.number === q).slice(0, 100);
    $("songList").replaceChildren(...hits.map(s => {
      const li = document.createElement("li");
      li.append(s.name, Object.assign(document.createElement("small"), { textContent: [s.number && "#" + s.number, s.source].filter(Boolean).join(" · ") }));
      li.onclick = () => openSong(s);
      return li;
    }));
  }
  $("songSearch").oninput = renderSongList;
  // Enter opens the top match
  $("songSearch").addEventListener("keydown", e => { if (e.key === "Enter" && $("songList").firstChild) $("songList").firstChild.click(); });

  async function openSong(s) {
    song = s.slides ? s : await fetch("/song?id=" + encodeURIComponent(s.id)).then(r => r.ok ? r.json() : null).catch(() => null);
    if (!song) return;
    const del = song.source === "VerseCast" && Object.assign(document.createElement("button"), { textContent: "Delete", onclick: deleteSong });
    $("songTitle").replaceChildren(song.name, ...(del ? [del] : []));
    $("slideList").replaceChildren(...song.slides.map((sl, i) => {
      const li = document.createElement("li");
      li.textContent = sl.text;
      li.onclick = () => toggleSlide(i);
      return li;
    }));
    refresh(false);
  }

  async function deleteSong() {
    if (!confirm(`Delete "${song.name}" from VerseCast?`)) return;
    await fetch("/song?id=" + encodeURIComponent(song.id), { method: "DELETE" });
    song = null;
    $("songTitle").replaceChildren();
    $("slideList").replaceChildren();
    loadSongs();
  }

  $("newSong").onclick = () => { $("newTitle").value = $("newLyrics").value = ""; $("songDialog").showModal(); };
  $("songDialog").onclose = async () => {
    if ($("songDialog").returnValue !== "save") return;
    const r = await fetch("/songs", { method: "POST", body: JSON.stringify({ name: $("newTitle").value, lyrics: $("newLyrics").value }) }).catch(() => null);
    if (!r || !r.ok) return alert("Couldn't save the song. Check it has a title and lyrics.");
    const { id } = await r.json();
    await loadSongs();
    openSong({ id });
  };

  // ---- always-on-top mini window (Document Picture-in-Picture, Edge/Chrome) ----
  $("openMini").onclick = async () => {
    if (!("documentPictureInPicture" in window)) return alert("The always-on-top window needs a recent Microsoft Edge or Google Chrome.");
    if (mini) return mini.focus();
    mini = await documentPictureInPicture.requestWindow({ width: 340, height: 260 });
    mini.document.head.append(document.querySelector("style").cloneNode(true));
    mini.document.title = "VerseCast";
    mini.document.body.className = "mini";
    mini.document.addEventListener("keydown", onKey);
    mini.addEventListener("pagehide", () => { mini = null; });
    renderMini();
  };

  function renderMini() {
    if (!mini) return;
    const d = mini.document, el = (tag, props, ...kids) => { const n = Object.assign(d.createElement(tag), props); n.append(...kids); return n; };
    const shown = onScreen();
    const now = shown
      ? el("div", { className: "now", style: "white-space: pre-line" }, el("b", { textContent: shown[0] }), shown[1])
      : el("div", { className: "now" }, el("span", { className: "empty", textContent: "Nothing showing" }));
    const label = current && Parse.label(current);
    d.body.replaceChildren(
      now,
      el("div", { className: "btns" },
        el("button", { textContent: "◀", title: "Previous verse", onclick: () => step(-1) }),
        el("button", { textContent: "▶", title: "Next verse", onclick: () => step(1) }),
        el("button", { textContent: "Clear", onclick: clearScreen }),
        el("button", { textContent: listening ? "Stop" : "Listen", className: "listen" + (listening ? " on" : ""), onclick: () => $("listen").click() })),
      el("div", { className: "chips" }, ...detected.slice(0, 6).map(({ ref }) =>
        el("button", { textContent: Parse.label(ref), className: Parse.label(ref) === label ? "live" : "", onclick: () => toggle(ref) }))));
  }

  // ---- speech ----
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;

  // a reference heard in the last 15s isn't re-shown, so live + final results (or a repeat) don't fight the operator
  const heard = new Map();
  function fresh(ref) {
    const label = Parse.label(ref), now = Date.now();
    if (now - (heard.get(label) || 0) < 15000) return false;
    heard.set(label, now);
    return true;
  }

  // act on words while they're still being spoken; drop the last word in case it's a half-said number ("John 3 1…6")
  function onInterim(text) {
    const done = text.trim().split(/\s+/).slice(0, -1).join(" ");
    Parse.findRefs(done).filter(fresh).forEach(r => addDetected(r));
  }

  function onFinal(text) {
    const p = document.createElement("p");
    p.textContent = text;
    $("transcript").insertBefore(p, $("interim"));
    // join with the previous phrase so "John 3" + "16" still matches, but skip refs already found there
    const before = Parse.findRefs(lastFinal).map(Parse.label);
    const found = Parse.findRefs(lastFinal + " " + text).filter(r => {
      const i = before.indexOf(Parse.label(r));
      if (i === -1) return true;
      before.splice(i, 1);
      return false;
    });
    // no reference spoken? see if they're quoting a verse word-for-word
    const already = Predict.predict(INDEX, lastFinal).map(g => Parse.label(g.ref));
    const guesses = found.length ? [] : Predict.predict(INDEX, lastFinal + " " + text).filter(g => !already.includes(Parse.label(g.ref)));
    lastFinal = text;
    for (const r of found) p.append(" ", Object.assign(document.createElement("mark"), { textContent: Parse.label(r) }));
    for (const g of guesses) p.append(" ", Object.assign(document.createElement("mark"), { className: "guess", textContent: "≈ " + Parse.label(g.ref) }));
    found.filter(fresh).forEach(r => addDetected(r));
    guesses.slice().reverse().forEach(g => addDetected(g.ref, true));
    $("transcript").scrollTop = $("transcript").scrollHeight;
  }

  function showListening(on) {
    $("listen").textContent = on ? "Stop listening" : "Start listening";
    $("listen").classList.toggle("on", on);
    $("status").textContent = on ? "Listening…" : "Not listening";
  }

  function setListening(on) {
    listening = on;
    showListening(on);
    renderMini();
    send(); // lets the OBS dock show whether we're listening
    if (on) {
      rec = new SR();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = $("lang").value;
      rec.onresult = e => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) onFinal(e.results[i][0].transcript.trim());
          else interim += e.results[i][0].transcript;
        }
        $("interim").textContent = interim;
        if (interim) onInterim(interim);
      };
      rec.onerror = e => {
        $("status").textContent = "Mic error: " + e.error;
        if (e.error === "not-allowed" || e.error === "service-not-allowed") setListening(false);
      };
      const go = () => track ? rec.start(track) : rec.start();
      rec.onend = () => { if (listening) go(); }; // browser stops after silence; keep going
      openMic().then(go, err => {
        setListening(false);
        $("status").textContent = "Can't open that input: " + err.message;
      });
    } else if (rec) {
      rec.onend = null;
      rec.stop();
      if (track) track.stop(), track = null;
    }
  }

  // ---- input source ----
  let track = null; // null = browser's default mic
  let micNamesKnown = false;
  async function openMic() {
    const id = $("mic").value;
    if (!id) return;
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: id } } });
    track = stream.getAudioTracks()[0];
  }

  async function loadMics() {
    const sel = $("mic");
    let saved = sel.value;
    try { saved = saved || localStorage.getItem("versecast-mic") || ""; } catch {}
    const mics = (await navigator.mediaDevices.enumerateDevices())
      .filter(d => d.kind === "audioinput" && d.deviceId && d.deviceId !== "default" && d.deviceId !== "communications");
    micNamesKnown = mics.some(d => d.label);
    sel.replaceChildren(new Option("Default microphone", ""), ...mics.map((d, i) => new Option(d.label || "Microphone " + (i + 1), d.deviceId)));
    sel.value = mics.some(d => d.deviceId === saved) ? saved : "";
  }

  // device names stay hidden until the mic has been allowed once, so ask when the list is opened
  $("mic").addEventListener("pointerdown", async () => {
    if (micNamesKnown) return;
    try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach(t => t.stop()); } catch {}
    loadMics();
  });
  $("mic").onchange = () => {
    try { localStorage.setItem("versecast-mic", $("mic").value); } catch {}
    if (listening) { setListening(false); setListening(true); }
  };
  navigator.mediaDevices.addEventListener("devicechange", loadMics);

  try { $("lang").value = localStorage.getItem("versecast-lang") || "en-GH"; } catch {}
  $("lang").onchange = () => {
    try { localStorage.setItem("versecast-lang", $("lang").value); } catch {}
    if (listening) { setListening(false); setListening(true); }
  };
  loadMics();
  $("listen").onclick = async () => {
    if (DOCK) { // the dock remote-controls the main VerseCast window in Chrome, which does the listening
      const r = await fetch("/command", { method: "POST", body: JSON.stringify({ cmd: $("listen").classList.contains("on") ? "stop" : "listen" }) }).catch(() => null);
      if (!r || !r.ok) $("status").textContent = "Opening VerseCast in Chrome… press again in a moment";
      if (r && r.status === 404) fetch("/open", { method: "POST" });
      return;
    }
    if (!SR) return alert("Speech recognition needs Google Chrome or Microsoft Edge.");
    setListening(!listening);
  };
</script>
</body>
</html>
